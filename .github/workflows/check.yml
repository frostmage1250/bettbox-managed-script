name: 检查自定义脚本

on:
  push:
    paths:
      - managed.js
      - .github/workflows/check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 语法检查
        run: node --check managed.js
